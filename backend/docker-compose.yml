services:
  # ==================== Infrastructure ====================
  redis:
    image: redis:7-alpine
    container_name: memorybun-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - memorybun-network

  postgres:
    image: postgres:15-alpine
    container_name: memorybun-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=memorybun
      - POSTGRES_PASSWORD=memorybun_dev
      - POSTGRES_DB=memorybun
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U memorybun" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - memorybun-network

  # ==================== Microservices ====================
  question-service:
    build:
      context: ./question_service
      dockerfile: Dockerfile
    container_name: memorybun-question-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Pass-through host env vars if set (optional)
      - DATA_DIR=${DATA_DIR:-data}
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - memorybun-network
    restart: unless-stopped

  transcription-service:
    build:
      context: ./transcription_service
      dockerfile: Dockerfile
    container_name: memorybun-transcription-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WHISPER_PRELOAD_MODEL=${WHISPER_PRELOAD_MODEL:-base}
      - STORAGE_TYPE=${STORAGE_TYPE:-FILESYSTEM}
    volumes:
      - transcription-screenshots:/app/data/screenshots
      - transcription-audio:/app/data/audio_chunks
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 60s
      timeout: 10s
      start_period: 60s # Longer due to Whisper model loading
      retries: 3
    networks:
      - memorybun-network
    restart: unless-stopped

  grading-service:
    build:
      context: ./grading_service
      dockerfile: Dockerfile
    container_name: memorybun-grading-service
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QUESTION_SERVICE_URL=${QUESTION_SERVICE_URL:-http://question-service:8000}
      - TRANSCRIPTION_SERVICE_URL=${TRANSCRIPTION_SERVICE_URL:-http://transcription-service:8001}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - MOCK_LLM_RESPONSE=${MOCK_LLM_RESPONSE:-False}
    depends_on:
      redis:
        condition: service_healthy
      question-service:
        condition: service_started
      transcription-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - memorybun-network
    restart: unless-stopped
